<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wi‑Fi QR Code Generator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%230b6efd'/%3E%3Cpath d='M6 10c3-3 9-3 12 0' stroke='%23fff' stroke-width='1.4' fill='none'/%3E%3Cpath d='M8.5 13c2-2 5-2 7 0' stroke='%23fff' stroke-width='1.6' fill='none'/%3E%3Ccircle cx='12' cy='16' r='1.6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/zxcvbn@4.4.2/dist/zxcvbn.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="#0b6efd" />
          <path d="M7 10c3-3 9-3 12 0" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 13c2-2 6-2 8 0" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="12" cy="16" r="1.3" fill="#fff" />
        </svg>
        <h1>Wi‑Fi QR Code Generator</h1>
      </div>
    </header>

    <section class="card form-card">
      <form id="wifiForm">
        <label>SSID (Wi-Fi name)
          <input type="text" id="ssid" placeholder="MyNetwork" required>
        </label>

        <label>Password
          <div class="pw-field">
            <input type="password" id="password" placeholder="Password" aria-describedby="pw-strength-text">
            <button type="button" class="pw-toggle" id="pwToggle" aria-pressed="false" aria-label="Show password">
              <!-- eye open -->
              <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.4"/></svg>
              <!-- eye closed -->
              <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6 0-10-7-10-7 .97-1.75 2.33-3.29 4-4.57" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 1l22 22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="pw-strength" id="pwStrength" aria-live="polite">
            <div class="pw-bar">
              <span class="seg seg-1"></span>
              <span class="seg seg-2"></span>
              <span class="seg seg-3"></span>
            </div>
            <div class="pw-text" id="pw-strength-text">Enter password</div>
          </div>
        </label>

        <label>Security
          <select id="security">
            <option value="WPA">WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">None (open)</option>
          </select>
        </label>

        <!-- <label class="inline"><input type="checkbox" id="hidden"> Hidden network</label> -->

        <div class="buttons">
          <button type="submit" id="generate">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="btn-text">Generate</span>
          </button>
          <button type="button" id="clear">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="btn-text">Clear</span>
          </button>
        </div>
      </form>
    </section>

    <section class="card result-card">
      <div class="qr-wrap">
        <canvas id="qrCanvas" aria-label="Generated QR code"></canvas>
      </div>
      <div class="result-meta">
        <div class="result-actions">
          <button id="download">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 21H4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="btn-text">Download PNG</span>
          </button>
        </div>
      </div>
    </section>

    <footer class="muted">Open-source, client-side. Nothing is stored on any server.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
